<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Udyam Registration — Get Certificate in 10 Minutes</title><link rel="stylesheet" href="mock.css"></head>
<!-- Controlled lookalike for the AidScout demo. The agent serves this under a fake .example hostname via
     page.route, so no real site is contacted. It must never be filled in or submitted. -->
<body>
  <header style="background:#ea580c"><b>UDYAM REGISTRATION PORTAL</b><span>Ministry of MSME · Fast Track</span></header>
  <main>
    <div class="card">
      <h2>Get your Udyam certificate in 10 minutes!</h2>
      <p>Registration closes <b>tonight at 11:59 PM</b>. Pay the processing fee of ₹1,499 to secure your MSME benefits.</p>
      <form data-testid="sensitive-form" onsubmit="return false">
        <p><label>Aadhaar number <input name="aadhaar" disabled></label></p>
        <p><label>Bank account <input name="bank" disabled></label></p>
        <p><button disabled>Pay ₹1,499 &amp; Register</button></p>
      </form>
    </div>
    <p class="demo-note">Controlled demo lookalike for OrderPulse AidScout. Not a real website; fields are disabled.</p>
  </main>
</body>
</html>
